<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f5f7fb] flex items-center justify-center min-h-screen p-4">
<div class="bg-white p-8 rounded-2xl border w-full max-w-sm shadow-sm">
<div class="text-center mb-8">
<img src="/static/logo.png" class="w-20 h-20 mx-auto rounded-full border shadow-sm">
<h1 class="font-bold mt-4 text-[14px] tracking-widest">LUTALI FOUNDATION</h1>
<p class="text-[11px] text-gray-500 mt-1">Secure Portal</p>
</div>
{% if error %}<div class="bg-red-50 text-red-600 p-3 rounded-xl text-xs mb-4 text-center">{{error}}</div>{% endif %}
<form method="POST">{% csrf_token %}
<input name="phone" placeholder="Phone Number" class="border rounded-xl p-3.5 w-full text-sm bg-gray-50 focus:bg-white outline-none" required>
<input name="member_no" placeholder="Member No (LUT-XXX)" class="border rounded-xl p-3.5 w-full mt-3 text-sm bg-gray-50 focus:bg-white outline-none" required>
<button class="bg-black text-white w-full p-3.5 rounded-xl mt-6 text-sm font-bold tracking-widest">Login</button>
</form>
<p class="text-[10px] text-gray-400 text-center mt-8">© 2026 Lutali Foundation • Till 1647509</p>
</div></body></html>
